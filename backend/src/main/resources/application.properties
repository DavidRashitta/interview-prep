spring.application.name=interview-prep-backend
server.port=8080

# --- AI provider (Spring AI) ---
# Using the OpenAI-compatible starter pointed at OpenRouter. Provide your key via the
# OPENROUTER_API_KEY environment variable. Never commit real keys.
# The sentinel default lets Spring AI's auto-config boot without a key; AiConfig then falls
# back to the stub interviewer (canned replies) so the whole stack still runs.
# To switch providers, replace the spring-ai-starter-model-openai dependency and these
# spring.ai.openai.* properties — no interviewer code changes.
spring.ai.openai.api-key=${OPENROUTER_API_KEY:MISSING}
# Spring AI 2.0 wraps the official openai-java SDK, which appends only /chat/completions to
# this base-url. So the base-url must include /v1 → https://openrouter.ai/api/v1/chat/completions.
spring.ai.openai.base-url=https://openrouter.ai/api/v1
# OpenRouter uses prefixed model ids (e.g. anthropic/claude-sonnet-4.5, openai/gpt-4o-mini).
spring.ai.openai.chat.model=cohere/north-mini-code:free
# Default per-chat-turn output budget; the feedback call overrides this with a larger budget.
spring.ai.openai.chat.max-tokens=1024
